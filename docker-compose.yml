# MySQL 8 + the platform. All credentials come from your git-ignored .env file (see .env.example).
#   docker compose up --build
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: hybrid_platform
      MYSQL_USER: ${DB_USERNAME:?Set DB_USERNAME in .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build: .
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    env_file: .env
    environment:
      DB_URL: jdbc:mysql://mysql:3306/hybrid_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
      STORAGE_ROOT: /data/storage
      PORT: "8080"
      # "docker" has no profile file: it only avoids the dev defaults. Switch to "prod" once a real payment
      # provider (Razorpay) is configured - the demo payment provider refuses to start under "prod".
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - app-data:/data

volumes:
  mysql-data:
  app-data:
