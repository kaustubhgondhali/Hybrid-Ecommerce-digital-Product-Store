<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Elaashop &amp; Elaatech</title>
  <meta name="description" content="Elaashop for audio, tech and lifestyle gear. Elaatech for software, licences and digital products.">
  <link rel="icon" type="image/png" href="/assets/img/favicon.png">
  <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>
  <main id="main">
    <div class="container">
      <section class="landing">
        <img class="landing-mark" src="/assets/img/elaa-mark.png" alt="">
        <h1>Welcome to Elaa</h1>
        <p class="lead">Two stores, one account. Pick where you want to start.</p>
        <div class="brand-cards">
          <a class="brand-card" href="/shop">
            <img src="/assets/img/elaashop-logo.png" alt="Elaashop">
            <div class="body">
              <h2>Elaashop</h2>
              <p>Hand-picked audio, tech and lifestyle deals from trusted stores.</p>
              <span class="btn">Enter Elaashop</span>
            </div>
          </a>
          <a class="brand-card" href="/digital">
            <img src="/assets/img/elaatech-logo.png" alt="Elaatech">
            <div class="body">
              <h2>Elaatech</h2>
              <p>Hand-picked software, courses, licences and e-books from trusted stores.</p>
              <span class="btn">Enter Elaatech</span>
            </div>
          </a>
        </div>
        <p class="mt small"><a href="/account">My account</a></p>
      </section>
    </div>
  </main>
</body>
</html>
