server:
  servlet:
    session:
      cookie:
        secure: true

spring:
  web:
    resources:
      cache:
        cachecontrol:
          max-age: 1h

app:
  mail:
    log-unsent-emails: false
  # Never seed [Demo] products in production unless explicitly asked for.
  demo-catalog: ${DEMO_CATALOG:false}

logging:
  level:
    com.hybrid.platform: INFO
