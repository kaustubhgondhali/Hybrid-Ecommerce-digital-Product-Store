spring:
  datasource:
    url: jdbc:h2:mem:hpp;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  web:
    resources:
      static-locations: classpath:/static/
  # MockMvc tests share MockHttpSession objects; JdbcSessionIntegrationTest covers the JDBC session store.
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.session.SessionAutoConfiguration

app:
  base-url: http://localhost
  demo-catalog: false
  affiliate-only: false
  rate-limit:
    enabled: false
  storage:
    root: ./target/test-storage
  payment:
    provider: demo
  mail:
    log-unsent-emails: false
  bootstrap:
    shop-admin-email: shop-admin@test.local
    shop-admin-password: TestOnly-Passw0rd
    digital-admin-email: digital-admin@test.local
    digital-admin-password: TestOnly-Passw0rd

logging:
  level:
    com.hybrid.platform: INFO
